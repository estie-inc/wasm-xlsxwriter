name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
      - run: npm ci
      - run: npm run build
      # Validate that the compiled WASM only contains the expected features.
      # These features are set by rust/.cargo/config.toml target-feature flags.
      # build-std ensures std is also compiled with these flags.
      # bulk-memory-opt is an implied sub-feature of bulk-memory.
      - name: Validate WebAssembly features
        run: |
          expected="bulk-memory bulk-memory-opt mutable-globals nontrapping-float-to-int sign-ext"
          for target in nodejs web; do
            actual=$(npx --no-install wasm-opt --print-features $target/wasm_xlsxwriter_bg.wasm 2>&1 | sed -n 's/^--enable-//p' | sort | xargs)
            echo "$target: $actual"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$target has unexpected features: $actual (expected: $expected)"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-build
          path: |
            nodejs/
            web/

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-build
      - run: npm ci
      - run: npm test

  test-nextjs:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-build
      - run: |
          cd examples/nextjs
          npm ci
          npm run build
          npx --no-install playwright install chromium --with-deps
          npm test

  test-nodejs:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-build
      - run: |
          cd examples/nodejs
          npm ci
          npm run build
          npm run start

  test-vite:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-build
      - run: |
          cd examples/vite
          npm ci
          npm run build
          npx --no-install playwright install chromium --with-deps
          npm test
